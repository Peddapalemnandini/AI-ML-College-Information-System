<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
<style>
body{
    background: linear-gradient(to right, #191919, #0d47a1);
    margin:0;
    padding:0;
    font-family: Arial, sans-serif;
}

.container{
    width:50%;
    margin:auto;
    margin-top:60px;
    background:linear-gradient(to right, #74ebd5, #ACB6E5);;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,0.2);
}

h1{
    text-align:left;
    color:black;
}

p{
    text-align:left;
    color:red;
}

.suggestions{
    text-align:left;
    margin-bottom:15px;
}

.suggestions button{
    background:#191919;
    color:white;
    border:none;
    padding:10px 15px;
    margin:5px;
    border-radius:20px;
    cursor:pointer;
    transition:0.3s;
}

.suggestions button:hover{
    background:#3498db;
    transform:scale(1.05);
}

#chat-box{
    border:2px solid #3498db;
    height:300px;
    padding:10px;
    overflow-y:scroll;
    border-radius:10px;
    background:lightpink;
}

.bot-msg{
    background:lightcyan;
    color:#0d47a1;
    padding:10px;
    margin:8px 0;
    border-radius:10px;
    width:fit-content;
}

.user-msg{
    background:lightskyblue;
    color:#155724;
    padding:10px;
    margin:8px 0;
    border-radius:10px;
    width:fit-content;
    margin-right:auto;
}

.input-area{
    margin-top:15px;
    display:flex;
    gap:10px;
}

input{
    flex:1;
    padding:12px;
    border:2px solid #3498db;
    border-radius:8px;
    outline:none;
}

.input-area button{
    background:#191919;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    transition:0.3s;
}
.input-area button:hover{
    background:#3498db;
    transform:scale(1.05);
}
.typing{
    color:black;
    font-style:italic;
}
</style>
</head>
<body>
<div class="container">
    <h1> GENAI ACADEMIC HELPDESK </h1>
    <p>Your Intelligent Campus Assistant</p>
    <div class="suggestions">
        <button onClick="setQuestion('what is library timing')"> Library</button>
        <button onClick="setQuestion('what is placement eligibility')"> Placement </button>
        <button onClick="setQuestion('what are hostel rules')"> Hostel </button>
        <button onClick="setQuestion('when do exam start')"> Exams </button>
    </div>
    <div id="chat-box">
        <div class="bot-msg">
           Hello! I am your GENAI Academic Assistant.
           Ask anything about:syllabus,placements,hostel,exam and more
        </div>
    </div>
    <div class="input-area">
        <input type="text" id="question" placeholder="Enter your question...">
        <button onClick="ask()">send</button>
    </div> 
    <script>
       function setQuestion(text){
               document.getElementById('question').value=text
    } 
     async function ask(){
        let q=document.getElementById("question").value;

        if(q.trim()=="")return;
        let box=document.getElementById("chat-box")
        box.innerHTML+=`

        <div class="user-msg">
            ${q}
            <div class="time">
             ${new Date().toLocaleTimeString()}
            </div>
        </div>`
        ;
        //typing animation
        box.innerHTML+=`
        <div class="typing" id="loading">
             AI is typing...
        </div>
        `

           box.scrollTop=box.scrollHeight;

           let res=await fetch("/ask",{
             method:"POST",
             headers: {
                "content-Type":"application/json"
             },
             body:JSON.stringify({
                question:q


             })

          });
          let data=await res.json();

          //remove loading

        document.getElementById("loading").remove();

        box.innerHTML += `
            <div class="bot-msg">
                ${data.answer}
                <div class="time">
                    ${new Date().toLocaleTimeString()}
                </div>
            </div>`;
           
             // clear input

             document.getElementById("question").value="";

        


    }
    document.getElementById("question").addEventListener("keypress",function(event){
        if(event.key === "Enter"){
            ask();
        }

    });
    </script>  
</body>
</html>
